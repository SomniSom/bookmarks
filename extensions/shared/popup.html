<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Закладки</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <h1>Закладки</h1>
    <p id="device" class="muted"></p>
  </header>

  <div id="auth">
    <label>Сервер <input id="server" type="text" inputmode="url" autocomplete="off" placeholder="example.com"></label>
    <label>Пароль <input id="password" type="password"></label>
    <button type="button" id="loginBtn">Войти</button>
  </div>

  <div id="app" hidden>
    <nav class="tabs">
      <button type="button" class="tab on" id="tabBrowse">Дерево</button>
      <button type="button" class="tab" id="tabAdd">Добавить</button>
    </nav>

    <div id="paneBrowse">
      <input id="q" type="search" placeholder="Поиск…" autocomplete="off">
      <div class="new-folder">
        <input id="folderName" placeholder="Новая папка" autocomplete="off">
        <button type="button" id="folderBtn">Создать</button>
      </div>
      <p id="folderParent" class="muted">в корне</p>
      <div id="tree" class="tree"></div>
      <div class="footer">
        <button type="button" class="ghost" id="openCabinet">Кабинет</button>
        <button type="button" class="ghost" id="logoutBtn">Выйти</button>
      </div>
    </div>

    <div id="paneAdd" hidden>
      <label>Название <input id="title"></label>
      <label>URL <input id="url"></label>
      <label>Папка <select id="folder"></select></label>
      <div class="new-folder">
        <input id="addFolderName" placeholder="Вложенная папка" autocomplete="off">
        <button type="button" class="ghost" id="addFolderBtn">Создать</button>
      </div>
      <label>Теги <input id="tags" list="taglist" placeholder="через запятую"></label>
      <datalist id="taglist"></datalist>
      <p id="dup" class="warn" hidden></p>
      <button type="button" id="saveBtn">Сохранить вкладку</button>
      <hr>
      <label>Имя папки импорта <input id="importName" placeholder="Импорт Chrome — дата"></label>
      <button type="button" id="importBtn">Импортировать закладки браузера</button>
    </div>
  </div>

  <p id="status"></p>
  <script src="api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
